<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title>작업자 관리</title><link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script></head>
<body><header><a class="brand" th:href="@{/admin/dashboard}">안전 관리</a><nav><a th:href="@{/admin/dashboard}">대시보드</a><a th:href="@{/admin/events}">이벤트</a><a th:href="@{/admin/workers}">작업자</a></nav><form th:action="@{/admin/logout}" method="post"><button class="secondary">로그아웃</button></form></header>
<main id="workers-page"><h1>작업자 관리</h1><section><h2>작업자 생성</h2><form id="worker-form" class="toolbar"><label>이름 <input name="workerName" maxlength="50" required></label><label>성별 <select name="sex" required><option value="M">M</option><option value="F">F</option><option value="U">미지정</option></select></label><label>나이 <input name="age" type="number" min="0" max="150" required></label><button>생성</button></form><p id="credentials" class="notice" role="status"></p></section>
<p id="message" role="status"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>이름</th><th>성별</th><th>나이</th><th>상태</th><th>관리</th></tr></thead><tbody id="workers-body"></tbody></table></div><div class="pagination"><button id="previous" class="secondary">이전</button><span id="page-info"></span><button id="next" class="secondary">다음</button></div></main></body></html>
