<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('이벤트 이력')}"></head><body><div class="app-shell"><aside th:replace="~{admin/fragments :: sidebar('events')}"></aside><div class="workspace"><header th:replace="~{admin/fragments :: topbar}"></header><p id="notice" role="status" aria-live="polite"></p><main id="events-page"><div class="page-heading"><div><p class="eyebrow">EVENT HISTORY</p><h1>이벤트 이력</h1><p class="muted">작업자 안전 이벤트의 접수·처리 상태를 확인합니다.</p></div></div><form class="toolbar" method="get" th:action="@{/admin/events}"><label>처리 상태<select name="processed"><option value="">전체</option><option value="false" th:selected="${processed == 'false'}">미처리</option><option value="true" th:selected="${processed == 'true'}">완료</option></select></label><label>작업자 ID<input name="workerId" type="number" min="1" th:value="${workerId}" placeholder="전체"></label><label>이벤트 유형<select name="eventType"><option value="">전체</option><option th:each="type : ${T(org.example.workersafety_server.entity.EventType).values()}" th:value="${type}" th:text="${type}" th:selected="${eventType == type.name()}"></option></select></label><button>조회</button></form><p id="message" role="status"></p><div class="table-wrap"><table><thead><tr><th>발생 시각</th><th>유형</th><th>작업자</th><th>발신 주체</th><th>처리 상태</th><th>처리 시각</th><th>관리자 메모</th><th>상세</th></tr></thead><tbody><tr th:each="event : ${eventsPage.items}"><td th:attr="data-time=${event.time}" th:text="${event.time}">-</td><td th:text="${event.eventType}">-</td><td th:text="|${event.workerName} (${event.workerId})|"></td><td th:text="${event.alertSender}">-</td><td><span class="badge" th:classappend="${event.processedAt == null ? ' NEW' : ' RESOLVED'}" th:text="${event.processedAt == null ? '미처리' : '완료'}">미처리</span></td><td th:attr="data-time=${event.processedAt}" th:text="${event.processedAt == null ? '-' : event.processedAt}">-</td><td class="report-note" th:text="${event.adminMemo == null ? '-' : event.adminMemo}">-</td><td><button type="button" class="open-event" th:attr="data-event-id=${event.eventId}">상세 보기</button></td></tr><tr th:if="${eventsPage.items.empty}"><td class="empty" colspan="8">표시할 데이터가 없습니다.</td></tr></tbody></table></div><div class="pagination"><a class="button-link" th:if="${page > 0}" th:href="@{/admin/events(page=${page - 1},processed=${processed},workerId=${workerId},eventType=${eventType})}">이전</a><span th:text="|${page + 1} / ${T(java.lang.Math).max(eventsPage.totalPages, 1)} 페이지|">1 페이지</span><a class="button-link" th:if="${page + 1 < eventsPage.totalPages}" th:href="@{/admin/events(page=${page + 1},processed=${processed},workerId=${workerId},eventType=${eventType})}">다음</a></div></main><dialog id="detail"><button id="close-detail" autofocus>닫기</button><div id="detail-body"></div></dialog></div></div></body></html>
