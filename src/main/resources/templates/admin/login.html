<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('관리자 로그인')}"></head>
<body class="logged-out"><header class="topbar"><strong class="mobile-brand">안전지킴이 · 관리자</strong></header><main><section class="login"><span class="eyebrow">SAFETY ADMIN</span><h1>관리자 로그인</h1><p class="muted">관리자 계정으로 로그인하세요.</p><p class="error" th:if="${param.error}">아이디 또는 비밀번호를 확인하세요.</p><p th:if="${param.logout}">로그아웃되었습니다.</p><form th:action="@{/admin/login}" method="post"><label>관리자 ID<input name="adminId" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section></main></body></html>
