<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('작업자 상세')}"></head><body><div class="app-shell"><aside th:replace="~{admin/fragments :: sidebar('workers')}"></aside><div class="workspace"><header th:replace="~{admin/fragments :: topbar}"></header><p id="notice" role="status" aria-live="polite"></p><main><a class="back-link" th:href="@{/admin/workers}">← 작업자 목록</a><div class="worker-hero surface"><div class="worker-avatar" th:text="${#strings.substring(worker.workerName,0,1)}">작</div><div class="worker-identity"><h1 th:text="${worker.workerName}">작업자</h1><p th:text="|ID ${worker.workerId} · 계정 ${worker.enabled ? '활성' : '탈퇴'}|">작업자 정보</p></div><button type="button" class="danger-button" disabled title="기능 연동 준비 중">긴급 SOS 발송</button></div><div class="cards worker-metrics"><div class="card"><span>심장박동 상태</span><strong>-</strong><small>측정 데이터 없음</small></div><div class="card"><span>산소포화도 상태</span><strong>-</strong><small>측정 데이터 없음</small></div><div class="card"><span>마지막 통신</span><strong class="metric-date">-</strong><small>기기 연동 준비 중</small></div></div><div class="worker-detail-grid"><section class="surface"><div class="surface-head"><div><h2>최근 이벤트</h2><p>작업자의 실제 접수 이벤트</p></div></div><div class="table-wrap"><table><thead><tr><th>발생 시각</th><th>유형</th><th>처리 상태</th><th>상세</th></tr></thead><tbody><tr th:each="event : ${eventsPage.items}"><td th:attr="data-time=${event.time}" th:text="${event.time}">-</td><td th:text="${event.eventType}">-</td><td th:text="${event.processedAt == null ? '미처리' : '완료'}">-</td><td><button class="open-event" type="button" th:attr="data-event-id=${event.eventId}">상세</button></td></tr><tr th:if="${eventsPage.items.empty}"><td class="empty" colspan="4">이력이 없습니다.</td></tr></tbody></table></div></section><section class="surface safety-panel"><div class="surface-head"><div><h2>안전확인 · 자동 SOS</h2><p>안전 확인 및 NFC 상태</p></div></div><div class="safety-state"><strong>-</strong><span>연동 준비 중</span></div><dl><dt>확인 주기</dt><dd>-</dd><dt>최근 NFC 확인</dt><dd>-</dd><dt>요청 시각</dt><dd>-</dd><dt>태그 ID</dt><dd>-</dd></dl><button type="button" disabled title="기능 연동 준비 중">안전확인 재요청</button><p class="muted">안전확인 기능 연동 준비 중입니다.</p></section></div><div class="pagination"><a class="button-link" th:if="${page > 0}" th:href="@{/admin/workers/{id}(id=${worker.workerId},page=${page - 1})}">이전</a><span th:text="|${page + 1} / ${T(java.lang.Math).max(eventsPage.totalPages, 1)} 페이지|">1 페이지</span><a class="button-link" th:if="${page + 1 < eventsPage.totalPages}" th:href="@{/admin/workers/{id}(id=${worker.workerId},page=${page + 1})}">다음</a></div></main><dialog id="detail"><button id="close-detail" autofocus>닫기</button><div id="detail-body"></div></dialog></div></div></body></html>
