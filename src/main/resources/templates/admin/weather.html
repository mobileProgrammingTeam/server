<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('날씨')}"></head><body><div class="app-shell"><aside th:replace="~{admin/fragments :: sidebar('weather')}"></aside><div class="workspace"><header th:replace="~{admin/fragments :: topbar}"></header><main><div class="page-heading"><div><p class="eyebrow">SITE WEATHER</p><h1>날씨</h1><p class="muted">설정된 현장의 현재 날씨를 확인합니다.</p></div></div><section class="surface weather-notice-panel"><div class="surface-head"><div><h2>관리자 주의 메시지</h2><p>외부 안내 발송 기능 연동 준비 중입니다.</p></div></div><form id="weather-notice-form"><fieldset disabled><label>주의 메시지<textarea name="message" maxlength="500" placeholder="연동 후 사용할 수 있습니다."></textarea></label><button type="button">전체 관리자에게 보내기</button></fieldset></form></section><div class="weather-grid"><section class="surface weather-current"><div class="surface-head"><div><h2>현재 날씨</h2><p th:if="${weather != null}" th:text="${weather.siteName}"></p></div></div>
  <p th:if="${weatherError != null}" class="empty" th:text="${weatherError}"></p>
  <!-- Added live weather values supplied by AdminWebController. -->
  <div th:if="${weather != null}">
    <p class="weather-value"><strong th:text="|${weather.temperatureC} °C|"></strong><span th:text="${weather.condition}"></span></p>
    <div class="weather-facts">
      <div><span>습도</span><strong th:text="|${weather.humidityPercent}%|"></strong></div>
      <div><span>데이터 기준 시각</span><strong th:attr="data-time=${weather.measuredAt}" th:text="${weather.measuredAt}"></strong></div>
      <div><span>출처</span><a href="https://open-meteo.com/" th:text="${weather.source}">Open-Meteo</a></div>
    </div>
  </div></section><section class="surface"><div class="surface-head"><div><h2>주의 메시지 기록</h2><p>등록된 안내 없음</p></div></div><div class="table-wrap"><table><thead><tr><th>등록 시각</th><th>작성자</th><th>내용</th></tr></thead><tbody><tr><td class="empty" colspan="3">등록된 주의 메시지가 없습니다.</td></tr></tbody></table></div></section></div></main></div></div></body></html>
