services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workersafety}
      POSTGRES_USER: ${POSTGRES_USER:-workersafety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  server:
    build: .
    environment:
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      MOBILE_TOKEN_TTL: ${MOBILE_TOKEN_TTL:-PT12H}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-workersafety}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-workersafety}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_PORT: 8080
    ports:
      - "${DOCKER_SERVER_PORT:-8081}:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
