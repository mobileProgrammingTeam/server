<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title th:text="${title}">안전지킴이 관리자</title><link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script></head>
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
  <a class="brand" th:href="@{/admin/dashboard}" aria-label="안전지킴이 대시보드"><span class="brand-mark">안</span><span><strong>안전지킴이</strong><small>현장 안전 관제</small></span></a>
  <div class="nav-label">MENU</div>
  <nav aria-label="주 메뉴"><a th:href="@{/admin/dashboard}" th:attr="aria-current=${active == 'dashboard' ? 'page' : null}"><span class="nav-icon">▦</span>대시보드</a><a th:href="@{/admin/alerts}" th:attr="aria-current=${active == 'alerts' ? 'page' : null}"><span class="nav-icon">!</span>긴급 알림·대응</a><a th:href="@{/admin/workers}" th:attr="aria-current=${active == 'workers' ? 'page' : null}"><span class="nav-icon">♟</span>작업자</a><a th:href="@{/admin/zones}" th:attr="aria-current=${active == 'zones' ? 'page' : null}"><span class="nav-icon">⌖</span>현장 구역</a><a th:href="@{/admin/connectivity}" th:attr="aria-current=${active == 'connectivity' ? 'page' : null}"><span class="nav-icon">◉</span>기기·통신 상태</a><a th:href="@{/admin/weather}" th:attr="aria-current=${active == 'weather' ? 'page' : null}"><span class="nav-icon">☀</span>날씨</a><a th:href="@{/admin/events}" th:attr="aria-current=${active == 'events' ? 'page' : null}"><span class="nav-icon">▤</span>이벤트 이력</a><a th:href="@{/admin/reports}" th:attr="aria-current=${active == 'reports' ? 'page' : null}"><span class="nav-icon">▥</span>처리 기록·보고서</a></nav>
  <div class="sidebar-footer"><span class="site-dot"></span><div><strong>현장 관리자</strong><small>안전 관리 시스템</small></div></div>
</aside>
<header class="topbar" th:fragment="topbar"><strong class="mobile-brand">안전지킴이 · 관리자</strong><div id="header-actions"><a class="worker-create-link" th:href="@{/admin/workers#worker-create}">+ 작업자 생성</a><a th:href="@{/admin/settings}">설정</a><a th:href="@{/admin/admins}">관리자 관리</a></div><form th:action="@{/admin/logout}" method="post"><button id="logout">로그아웃</button></form></header>
<dialog id="detail"><button id="close-detail" autofocus>닫기</button><div id="detail-body"></div></dialog>
<div th:fragment="scripts"><p id="notice" role="status" aria-live="polite"></p></div>
<section th:fragment="eventDetail(event)" class="surface"><h2>위험 이벤트 상세</h2><dl><dt>작업자</dt><dd th:text="|${event.workerName} (${event.workerId})|"></dd><dt>유형</dt><dd th:text="${event.eventType}"></dd><dt>발신 주체</dt><dd th:text="${event.alertSender}"></dd><dt>처리 상태</dt><dd th:text="${event.processedAt == null ? '미처리' : '처리 완료'}"></dd><dt>발생 시각</dt><dd th:attr="data-time=${event.time}" th:text="${event.time}"></dd><dt>수신 시각</dt><dd th:attr="data-time=${event.receivedAt}" th:text="${event.receivedAt}"></dd><dt>처리자 ID</dt><dd th:text="${event.processedBy == null ? '-' : event.processedBy}"></dd><dt>처리 메모</dt><dd th:text="${event.adminMemo == null ? '-' : event.adminMemo}"></dd></dl><form th:if="${event.processedAt == null}" class="process-event-form" th:attr="data-event-id=${event.eventId}"><label>처리 메모<textarea name="adminMemo" minlength="1" maxlength="500" required></textarea></label><button>처리 완료</button></form></section>
</body></html>
