<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('긴급 알림·대응')}"></head><body><div class="app-shell"><aside th:replace="~{admin/fragments :: sidebar('alerts')}"></aside><div class="workspace"><header th:replace="~{admin/fragments :: topbar}"></header><p id="notice" role="status" aria-live="polite"></p><main id="alerts-page"><div class="page-heading"><div><p class="eyebrow">LIVE RESPONSE</p><h1>긴급 알림·대응</h1><p class="muted">미처리 이벤트를 확인하고 실제 대응 내용을 기록합니다.</p></div><a class="text-link" th:href="@{/admin/events}">전체 이벤트 보기 →</a></div><div class="cards"><div class="card"><span>미처리 이벤트</span><strong th:text="${eventsPage.totalElements}">0</strong></div><div class="card"><span>위험도 정보</span><strong>-</strong><small>연동 준비 중</small></div><div class="card"><span>기기 통신 상태</span><strong>-</strong><small>연동 준비 중</small></div></div><section class="surface panel"><div class="surface-head"><h2>대응 대기 목록</h2><span class="muted">실제 미처리 이벤트</span></div><div class="table-wrap"><table><thead><tr><th>발생 시각</th><th>작업자</th><th>이벤트 유형</th><th>처리 상태</th><th>대응</th></tr></thead><tbody><tr th:each="event : ${eventsPage.items}"><td th:attr="data-time=${event.time}" th:text="${event.time}">-</td><td th:text="|${event.workerName} (${event.workerId})|">-</td><td th:text="${event.eventType}">-</td><td>미처리</td><td><button type="button" class="open-event" th:attr="data-event-id=${event.eventId}">상세·처리</button></td></tr><tr th:if="${eventsPage.items.empty}"><td class="empty" colspan="5">대응 대기 이벤트가 없습니다.</td></tr></tbody></table></div></section></main><dialog id="detail"><button id="close-detail" autofocus>닫기</button><div id="detail-body"></div></dialog></div></div></body></html>
