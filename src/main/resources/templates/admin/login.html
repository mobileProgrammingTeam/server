<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 로그인</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><main class="login"><h1>작업자 안전 관리</h1><p>관리자 계정으로 로그인하세요.</p>
<p class="error" th:if="${param.error}">아이디 또는 비밀번호를 확인하세요.</p>
<p th:if="${param.logout}">로그아웃되었습니다.</p>
<form th:action="@{/admin/login}" method="post">
    <label>관리자 ID <input name="adminId" required autocomplete="username"></label>
    <label>비밀번호 <input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit">로그인</button>
</form></main></body></html>
