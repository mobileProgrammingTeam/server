<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('처리 기록·보고서')}"></head><body><div class="app-shell"><aside th:replace="~{admin/fragments :: sidebar('reports')}"></aside><div class="workspace"><header th:replace="~{admin/fragments :: topbar}"></header><main><div class="page-heading"><div><p class="eyebrow">EVENT HISTORY</p><h1>처리 기록·보고서</h1><p class="muted">실제 처리 완료된 이벤트와 관리자 메모를 조회합니다.</p></div><button type="button" id="export-report" th:disabled="${eventsPage.items.empty}">CSV 내려받기</button></div><div class="cards"><div class="card"><span>전체 이벤트</span><strong th:text="${dashboard.eventCount}">0</strong></div><div class="card"><span>처리 완료</span><strong th:text="${dashboard.eventCount - dashboard.pendingCount}">0</strong></div><div class="card"><span>현재 페이지 처리 기록</span><strong th:text="${eventsPage.totalElements}">0</strong></div></div><form class="toolbar" id="report-filter"><label>작업자·이벤트 검색<input name="q"></label><label>처리 유형<select name="action"><option value="">전체</option><option value="처리 완료">처리 완료</option></select></label><button type="button" id="report-search">조회</button></form><section class="surface panel"><h2>처리 이력</h2><div class="table-wrap"><table id="report-table"><thead><tr><th>처리 시각</th><th>이벤트 ID</th><th>작업자</th><th>처리</th><th>처리자 ID</th><th>관리자 메모</th></tr></thead><tbody><tr th:each="event : ${eventsPage.items}"><td th:attr="data-time=${event.processedAt}" th:text="${event.processedAt}">-</td><td th:text="${event.eventId}">-</td><td th:text="|${event.workerName} (${event.workerId})|">-</td><td>처리 완료</td><td th:text="${event.processedBy == null ? '-' : event.processedBy}">-</td><td class="report-note" th:text="${event.adminMemo == null ? '-' : event.adminMemo}">-</td></tr><tr th:if="${eventsPage.items.empty}"><td class="empty" colspan="6">처리 완료된 이벤트가 없습니다.</td></tr></tbody></table></div><div class="pagination"><a class="button-link" th:if="${page > 0}" th:href="@{/admin/reports(page=${page - 1})}">이전</a><span th:text="|${page + 1} / ${T(java.lang.Math).max(eventsPage.totalPages, 1)} 페이지|">1 페이지</span><a class="button-link" th:if="${page + 1 < eventsPage.totalPages}" th:href="@{/admin/reports(page=${page + 1})}">다음</a></div></section></main></div></div></body></html>
