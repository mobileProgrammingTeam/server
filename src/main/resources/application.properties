spring.application.name=workersafety_server
spring.devtools.add-properties=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
spring.profiles.default=local
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workersafety}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:workersafety}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:workersafety}
app.token-ttl=${MOBILE_TOKEN_TTL:PT12H}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
server.servlet.session.cookie.http-only=true
